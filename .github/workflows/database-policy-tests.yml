name: Database policy tests

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "tests/auth-jwt-rls.integration.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database-policy-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "tests/auth-jwt-rls.integration.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database-policy-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-platform-database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-policy-tests:
    name: Replay migrations and run transactional authorization probes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.1.0

      - name: Initialize isolated local Supabase configuration
        run: supabase init

      - name: Start isolated local Supabase services
        run: supabase start -x studio,mailpit,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor

      - name: Rebuild local database from every committed migration
        run: supabase db reset --local --no-seed

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run listing staff authorization probe
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/listing_staff_role_probe.sql

      - name: Run service-request row-level security probe
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/service_request_rls_probe.sql

      - name: Run service-request RPC authorization probe
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/service_request_rpc_probe.sql

      - name: Run private-document boundary probe
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/private_document_boundary_probe.sql

      - name: Run public listing-media boundary probe
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/listing_media_boundary_probe.sql

      - name: Run listing-media intake quota probe
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/listing_media_intake_probe.sql

      - name: Run listing-media review workspace probe
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/listing_media_review_workspace_probe.sql

      - name: Run listing-media publication authorization probe
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/listing_media_publication_probe.sql

      - name: Run public listing-media projection probe
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/public_listing_media_projection_probe.sql

      - name: Run knowledge-content boundary probe
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/knowledge_content_boundary_probe.sql

      - name: Run private-document quota probe
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/private_document_quota_probe.sql

      - name: Set up Node.js for Auth integration probe
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies for Auth integration probe
        run: npm ci

      - name: Run real Supabase Auth JWT and RLS integration probe
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          node tests/auth-jwt-rls.integration.mjs

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
