name: Reconcile Supabase migration history

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-history:
    name: Mark already-applied schema migrations in remote history
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: xpbjdeknjudurulogjkr
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.1.0

      - name: Verify required secrets exist
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as GitHub Actions repository secrets before running this workflow."
            exit 1
          fi

      - name: Initialize temporary CLI workspace
        run: supabase init

      - name: Link only the dedicated Bangladesh Property Platform project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration history before repair
        run: supabase migration list --remote

      - name: Mark only verified, already-applied migrations as applied
        run: |
          supabase migration repair \
            20261112131600 \
            20261113100000 \
            20261113120000 \
            20261113130000 \
            --status applied

      - name: Verify local and remote migration histories
        run: supabase migration list --remote
